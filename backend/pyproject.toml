[project]
name = "tramontana-backend"
version = "0.1.0"
description = "Tramontana RAG backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.6.3",
    "docling>=2.146.0",
    "fastapi>=0.162.0",
    "litellm==1.106.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-celery>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2,<2.1",
    "structlog>=26.1.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
    "testcontainers[postgres,redis]>=4.15.0",
]

[tool.uv]
package = false

# Linux (the Docker image) gets CPU-only torch; PyPI's Linux wheels pull ~3 GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real Postgres/Redis (testcontainers)",
    "eval_smoke: runs the evaluation harness end to end with the mock gateway",
]
filterwarnings = [
    # Starlette nudges towards httpx2; the brief pins httpx for TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Emitted by LiteLLM's own typing at import; not actionable here.
    "ignore:Item 'summary' on TypedDict class:UserWarning",
    # Docling reads its own deprecated option fields internally; we set neither.
    "ignore:`force_full_page_ocr` is deprecated:DeprecationWarning",
    "ignore:This field is deprecated. Use `generate_page_images=True`:DeprecationWarning",
]
