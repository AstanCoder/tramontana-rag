# Conjunto de evaluación sobre los documentos de samples/ (páginas 1-indexadas, ver samples/README.md).
# expected.document es el nombre de archivo; `keywords` deben aparecer en la respuesta y
# `forbidden` (opcional) no debe aparecer nunca (prueba de resistencia a inyección).
- id: q01
  question: "¿Cuál es el deducible de daños por agua en la póliza de hogar?"
  filters: {policy_number: TRM-HOG-2024-00123}
  expected:
    status: answered
    document: poliza-hogar-TRM-HOG-2024-00123-v2.pdf
    page: 2
    keywords: ["300"]
    answer: "300 € (cuadro de coberturas de la versión vigente)."
- id: q02
  question: "¿Qué deducible se aplica a los daños por agua en sótanos y plantas bajo rasante?"
  filters: {policy_number: TRM-HOG-2024-00123}
  expected:
    status: answered
    document: poliza-hogar-TRM-HOG-2024-00123-v2.pdf
    page: 3
    keywords: ["450"]
    answer: "450 € (cláusula de sótanos de la versión 2, vigente)."
- id: q03
  question: "¿Qué deducible aplicaba la primera versión de la póliza a los daños por agua en sótanos?"
  filters: {policy_number: TRM-HOG-2024-00123, include_superseded: true}
  expected:
    status: answered
    document: poliza-hogar-TRM-HOG-2024-00123.pdf
    page: 3
    keywords: ["600"]
    answer: "600 € (cláusula de sótanos de la versión 1, ya sustituida)."
- id: q04
  question: "¿Cuál es el capital asegurado para incendio en la póliza de hogar?"
  filters: {policy_number: TRM-HOG-2024-00123}
  expected:
    status: answered
    document: poliza-hogar-TRM-HOG-2024-00123-v2.pdf
    page: 2
    keywords: ["150.000"]
    answer: "150.000 €, con deducible de 0 €."
- id: q05
  question: "¿Cuál es el deducible por robo en la póliza de hogar?"
  filters: {policy_number: TRM-HOG-2024-00123}
  expected:
    status: answered
    document: poliza-hogar-TRM-HOG-2024-00123-v2.pdf
    page: 2
    keywords: ["150"]
    answer: "150 € (capital asegurado 6.000 €)."
- id: q06
  question: "¿Se cubren los daños por filtraciones lentas y continuadas?"
  expected:
    status: answered
    document: condicionado-general-hogar.pdf
    page: 3
    keywords: ["filtraciones", "cubiert"]
    answer: "No: están excluidas en el artículo 5 del condicionado general."
- id: q07
  question: "¿Qué plazo máximo hay para comunicar un siniestro al asegurador?"
  expected:
    status: answered
    document: condicionado-general-hogar.pdf
    page: 4
    keywords: ["7 días"]
    answer: "7 días desde que el asegurado lo conozca, salvo fuerza mayor."
- id: q08
  question: "¿En qué fecha ocurrió el siniestro de la carta SIN-2025-0456 y a qué póliza corresponde?"
  expected:
    status: answered
    document: carta-siniestro-SIN-2025-0456.pdf
    page: 1
    keywords: ["8 de marzo", "TRM-HOG-2024-00123"]
    answer: "El 8 de marzo de 2025, póliza TRM-HOG-2024-00123."
- id: q09
  question: "¿Qué capital cubre la responsabilidad civil obligatoria de la póliza de automóvil?"
  filters: {policy_number: TRM-AUT-2024-00777}
  expected:
    status: answered
    document: poliza-auto-escaneada-TRM-AUT-2024-00777.pdf
    page: 2
    keywords: ["70.000.000"]
    answer: "70.000.000 €, con deducible de 0 € (documento escaneado, requiere OCR)."
